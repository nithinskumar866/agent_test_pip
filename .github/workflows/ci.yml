name: CI

on:
  push:
    branches: [main, "rework/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # Judge SDKs only: framework tests skip here and run in the integrations job.
      - run: pip install -e ".[anthropic,openai,ollama]" pytest-xdist
      - run: python -m pytest -q

  integrations:
    name: Framework integrations (real SDKs)
    runs-on: ubuntu-latest
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]"
      - run: python -m pytest -q tests/test_integrations_real.py tests/test_integrations_e2e.py tests/test_frameworks_extra.py -rs

  coverage:
    # Every framework SDK installed, so no test skips; fails below 90% (see pyproject.toml).
    name: Test coverage
    runs-on: ubuntu-latest
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]" "coverage[toml]>=7.5"
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  newest-openai-agents:
    # The newest openai-agents needs openai 3, which the [all] install can't
    # currently resolve alongside CrewAI, so it gets its own job.
    name: Framework integrations (newest OpenAI Agents SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[openai-agents]"
      - run: pip list | grep -iE "^(openai|openai-agents) "
      - run: python -m pytest -q tests/test_integrations_real.py tests/test_integrations_e2e.py tests/test_frameworks_extra.py -rs

  package:
    name: Build and verify the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel alone and run the examples against it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/agenttest --version
          mkdir /tmp/examples && cp examples/*.py /tmp/examples/
          cd /tmp/examples && /tmp/wheel-env/bin/python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  action:
    # Runs this repo's GitHub Action (action.yml) on a real report, so it is tested
    # before anyone relies on it. Commenting is off: there is no pull request here.
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m pytest -q examples --agenttest-report "$RUNNER_TEMP/report.json"
      - name: Report only
        uses: ./
        with:
          report: ${{ runner.temp }}/report.json
          comment: "false"
      - name: Compare against a baseline
        uses: ./
        with:
          report: ${{ runner.temp }}/report.json
          baseline: ${{ runner.temp }}/report.json
          max-token-increase: "10"
          comment: "false"
      - name: The summary was written
        run: grep -q "No regressions" "$RUNNER_TEMP/agenttest-summary.md"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install ".[anthropic,openai,ollama]"
      - run: pip-audit --skip-editable --progress-spinner off
