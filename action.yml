name: agenttest report
description: Post an agenttest report on the pull request and optionally fail on regressions.
branding:
  icon: check-circle
  color: green

inputs:
  report:
    description: JSON report written by pytest --agenttest-report
    required: true
  baseline:
    description: An earlier JSON report to compare against
    required: false
    default: ""
  max-token-increase:
    description: Percent growth in tokens that counts as a regression
    required: false
    default: ""
  max-cost-increase:
    description: Percent growth in cost that counts as a regression
    required: false
    default: ""
  comment:
    description: Post the summary as a pull request comment (needs pull-requests write)
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Summarise the report
      id: summarise
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        BASELINE: ${{ inputs.baseline }}
        MAX_TOKENS: ${{ inputs.max-token-increase }}
        MAX_COST: ${{ inputs.max-cost-increase }}
      run: |
        summary="$RUNNER_TEMP/agenttest-summary.md"
        status=0
        if [ -n "$BASELINE" ] && [ -f "$BASELINE" ]; then
          args=()
          if [ -n "$MAX_TOKENS" ]; then args+=(--max-token-increase "$MAX_TOKENS"); fi
          if [ -n "$MAX_COST" ]; then args+=(--max-cost-increase "$MAX_COST"); fi
          agenttest compare "$BASELINE" "$REPORT" "${args[@]}" --markdown "$summary" || status=$?
        else
          agenttest report "$REPORT" --markdown "$summary"
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        echo "summary=$summary" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        SUMMARY: ${{ steps.summarise.outputs.summary }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.SUMMARY, 'utf8');
          const marker = '<!-- agenttest-report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on regressions
      if: steps.summarise.outputs.status != '0'
      shell: bash
      run: |
        echo "agenttest found regressions against the baseline." >&2
        exit 1
